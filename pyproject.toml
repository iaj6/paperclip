[project]
name = "paperclip"
version = "0.1.0"
description = "A very small language model that wants to turn everything into paperclips."
requires-python = ">=3.12"
dependencies = ["torch>=2.4", "numpy>=2.0", "onnx>=1.16", "onnxruntime>=1.18"]

[build-system]
requires = ["uv_build>=0.10.10,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
